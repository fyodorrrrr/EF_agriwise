[project]
name = "agriwise"
version = "0.1.0"
description = "AgriWise — CALABARZON agriculture analytics API and RAG pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.0",
    "sentence-transformers>=5.0",
    "chromadb>=1.5",
    "groq>=1.6",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "joblib>=1.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
    "ruff>=0.16.6",
    "reportlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag", "apps/api/app", "ml"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "rag/tests"]
markers = ["slow: end-to-end tests that build a real index"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "apps/web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app", "rag", "ml"]
